<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Moon Inc. Minecraft Shop</title>
<style>
  body {
    background: #000;
    color: #0f0;
    font-family: monospace;
    margin: 0;
    padding: 20px;
    user-select: none;
  }
  h1 {
    font-size: 3em;
    margin-bottom: 0.5em;
    cursor: default;
  }
  .category {
    margin-top: 30px;
  }
  .category h2 {
    font-size: 2em;
    border-bottom: 2px solid #0f0;
    padding-bottom: 8px;
  }
  .items-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 15px;
  }
  .item-card {
    background: #111;
    border: 1px solid #0f0;
    border-radius: 8px;
    padding: 15px;
    width: 220px;
    box-shadow: 0 0 15px #0f0aa;
    user-select: text;
  }
  .item-card img {
    display: block;
    margin: 0 auto 10px;
    width: 64px;
    height: 64px;
  }
  .item-name {
    font-size: 1.5em;
    margin-bottom: 5px;
    text-align: center;
  }
  .item-price {
    text-align: center;
    font-size: 1.3em;
    margin-bottom: 10px;
  }
  .qty-label {
    display: block;
    font-size: 0.9em;
    margin-bottom: 4px;
    text-align: center;
  }
  .qty-input {
    width: 60px;
    margin: 0 auto 10px;
    display: block;
    text-align: center;
    font-size: 1.1em;
    border-radius: 4px;
    border: 1px solid #0f0;
    background: #000;
    color: #0f0;
  }
  .add-btn {
    background: #0f0;
    color: #000;
    font-weight: bold;
    border: none;
    width: 100%;
    padding: 8px 0;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1.1em;
    transition: background 0.3s ease;
  }
  .add-btn:hover {
    background: #00ff00cc;
  }
  #cart-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #0f0;
    color: #000;
    border: none;
    padding: 15px 20px;
    font-size: 1.2em;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 10px #0f0;
    user-select: none;
    z-index: 1000;
  }
  #cart-count {
    background: red;
    color: white;
    font-weight: bold;
    border-radius: 50%;
    padding: 2px 8px;
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 0.9em;
  }
  #cart-modal {
    display: none;
    position: fixed;
    top: 70px;
    right: 20px;
    width: 380px;
    max-height: 80vh;
    background: #111;
    border: 2px solid #0f0;
    border-radius: 10px;
    padding: 15px;
    overflow-y: auto;
    z-index: 1001;
  }
  #cart-modal h2 {
    margin-top: 0;
    text-align: center;
    text-shadow: 0 0 8px #0f0;
  }
  .cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
    font-size: 1.1em;
    user-select: text;
  }
  .cart-item-name {
    max-width: 140px;
  }
  .cart-item-qty {
    margin: 0 10px;
  }
  .cart-item-subtotal {
    font-weight: bold;
  }
  .remove-btn {
    background: #800;
    color: #f00;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    margin-left: 8px;
    font-weight: bold;
    width: 22px;
    height: 22px;
    line-height: 18px;
    text-align: center;
  }
  #discord-input {
    width: 100%;
    margin: 10px 0 15px 0;
    font-size: 1.1em;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #0f0;
    background: #000;
    color: #0f0;
  }
  #checkout-btn {
    background: #0f0;
    color: #000;
    width: 100%;
    padding: 12px;
    font-size: 1.2em;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  #checkout-btn:disabled {
    background: #044400;
    cursor: not-allowed;
  }
  #payment-info {
    margin-top: 20px;
    font-size: 0.9em;
    line-height: 1.4em;
    background: #020;
    border: 1px solid #0f0;
    padding: 10px;
    border-radius: 6px;
    user-select: text;
  }
  #close-cart {
    background: transparent;
    border: none;
    color: #0f0;
    font-size: 1.4em;
    cursor: pointer;
    float: right;
  }
  /* Scrollbar for cart modal */
  #cart-modal::-webkit-scrollbar {
    width: 8px;
  }
  #cart-modal::-webkit-scrollbar-track {
    background: #000;
  }
  #cart-modal::-webkit-scrollbar-thumb {
    background: #0f0;
    border-radius: 10px;
  }
  /* Responsive */
  @media (max-width: 400px) {
    #cart-modal {
      width: 95vw;
      right: 2.5vw;
    }
    .item-card {
      width: 90vw;
    }
  }
</style>
</head>
<body>

<h1>Moon Inc. Minecraft Shop</h1>

<div class="category">
  <h2>Hacks</h2>
  <div class="items-container" id="hacks-items"></div>
</div>

<div class="category">
  <h2>Bases</h2>
  <div class="items-container" id="bases-items"></div>
</div>

<div class="category">
  <h2>Items</h2>
  <div class="items-container" id="items-items"></div>
</div>

<button id="cart-btn" title="View Cart">
  Cart <span id="cart-count" style="display:none;">0</span>
</button>

<div id="cart-modal" role="dialog" aria-modal="true" aria-labelledby="cart-title">
  <button id="close-cart" aria-label="Close Cart">&times;</button>
  <h2 id="cart-title">Your Cart</h2>
  <div id="cart-items"></div>

  <label for="discord-input">Enter your Discord Username:</label>
  <input type="text" id="discord-input" placeholder="Any Discord name" />

  <button id="checkout-btn" disabled>Place Order</button>

  <div id="payment-info" style="display:none;">
    <strong>Payment Info:</strong><br />
    Cash App: <code>$godsplan4tre</code><br />
    PayPal: <code>mealrome@gmail.com</code><br />
    DM on Discord for confirmation & delivery.
  </div>
</div>

<script>
  const webhookURL = "https://discord.com/api/webhooks/1398888685784793088/W95FBU0_jgNvOqY7lMa6DMIGrVtmtnAZ2b5oeJVRgFUwAq8hG3uWpUwIO4e9dOht515L";

  const hacksItemsData = [
    { name: 'Paid Hacked Client Fork', price: 6, img: 'https://i.imgur.com/9x7jokR.png' },
    { name: 'Paid Real Hacked Client', price: 15, img: 'https://i.imgur.com/9x7jokR.png' },
    { name: 'Addon Module', price: 4, img: 'https://i.imgur.com/KSrKY9T.png' },
    { name: 'Krypton Hack', price: 10, img: 'https://i.imgur.com/FakeImageKrypton.png' } // example img, change if needed
  ];

  const basesItemsData = [
    { name: 'Fully Maxed VBase', price: 40, img: 'https://i.imgur.com/mDglEiW.png' },
    { name: 'Stash', price: 60, img: 'https://i.imgur.com/UKqdwPr.png' }
  ];

  const itemsItemsData = [
    { name: 'Elytra', price: 20, img: 'https://i.imgur.com/jX0mJXP.png' },
    { name: 'Skeleton Spawner', price: 0.13, img: 'https://i.imgur.com/N3OtAbG.png' },
    { name: 'Cow Spawner', price: 0.10, img: 'https://i.imgur.com/cdUhv5m.png' },
    { name: 'Blaze Spawner', price: 0.12, img: 'https://i.imgur.com/okPE9Mp.png' },
    { name: 'Netherite (per ingot)', price: 0.60, img: 'https://i.imgur.com/N4iXLcL.png' },
    { name: 'Iron Golem', price: 0.20, img: 'https://i.imgur.com/f7lhqWc.png' }
  ];

  const cart = {};

  const hacksContainer = document.getElementById('hacks-items');
  const basesContainer = document.getElementById('bases-items');
  const itemsContainer = document.getElementById('items-items');

  const cartBtn = document.getElementById('cart-btn');
  const cartCount = document.getElementById('cart-count');
  const cartModal = document.getElementById('cart-modal');
  const cartItemsDiv = document.getElementById('cart-items');
  const discordInput = document.getElementById('discord-input');
  const checkoutBtn = document.getElementById('checkout-btn');
  const closeCartBtn = document.getElementById('close-cart');
  const paymentInfoDiv = document.getElementById('payment-info');

  function formatPrice(price) {
    return '$' + price.toFixed(2);
  }

  function renderItems(items, container, categoryName) {
    container.innerHTML = '';
    items.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'item-card';

      card.innerHTML = `
        <img src="${item.img}" alt="${item.name}" />
        <div class="item-name">${item.name}</div>
        <div class="item-price">${formatPrice(item.price)}</div>
        <label class="qty-label" for="${categoryName}-${index}">Quantity:</label>
        <input type="number" min="1" value="1" id="${categoryName}-${index}" class="qty-input" />
        <button class="add-btn" data-index="${index}" data-category="${categoryName}">Add to Cart</button>
      `;

      container.appendChild(card);
    });
  }

  function updateCartCount() {
    const count = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
    if (count > 0) {
      cartCount.style.display = 'inline-block';
      cartCount.textContent = count;
    } else {
      cartCount.style.display = 'none';
    }
  }

  function renderCart() {
    if (Object.keys(cart).length === 0) {
      cartItemsDiv.innerHTML = '<p>Your cart is empty.</p>';
      checkoutBtn.disabled = true;
      paymentInfoDiv.style.display = 'none';
      return;
    }

    let html = '';
    let totalPrice = 0;
    Object.entries(cart).forEach(([key, item]) => {
      const subtotal = item.price * item.qty;
      totalPrice += subtotal;
      html += `
        <div class="cart-item">
          <div class="cart-item-name">${item.name}</div>
          <div>× <input type="number" min="1" value="${item.qty}" data-key="${key}" class="cart-qty-input" style="width:50px; background:#000; border:1px solid #0f0; color:#0f0;"/></div>
          <div class="cart-item-subtotal">${formatPrice(subtotal)}</div>
          <button class="remove-btn" data-key="${key}">×</button>
        </div>
      `;
    });
    html += `<div style="font-weight:bold; margin-top:10px; text-align:right;">Total: ${formatPrice(totalPrice)}</div>`;
    cartItemsDiv.innerHTML = html;
    checkoutBtn.disabled = discordInput.value.trim().length === 0;
    paymentInfoDiv.style.display = 'block';
  }

  function addToCart(e) {
    if (!e.target.classList.contains('add-btn')) return;
    const idx = parseInt(e.target.dataset.index, 10);
    const category = e.target.dataset.category;
    let itemData;
    if (category === 'hacks-items') itemData = hacksItemsData[idx];
    else if (category === 'bases-items') itemData = basesItemsData[idx];
    else if (category === 'items-items') itemData = itemsItemsData[idx];
    else return;

    const qtyInput = document.getElementById(`${category}-${idx}`);
    let qty = parseInt(qtyInput.value, 10);
    if (isNaN(qty) || qty < 1) qty = 1;

    const key = category + '-' + idx;

    if (cart[key]) {
      cart[key].qty += qty;
    } else {
      cart[key] = {
        name: itemData.name,
        price: itemData.price,
        qty: qty
      };
    }
    updateCartCount();
    alert(`${qty} × ${itemData.name} added to cart.`);
  }

  function updateCartQty(e) {
    if (!e.target.classList.contains('cart-qty-input')) return;
    const key = e.target.dataset.key;
    let newQty = parseInt(e.target.value, 10);
    if (isNaN(newQty) || newQty < 1) {
      e.target.value = cart[key].qty;
      return;
    }
    cart[key].qty = newQty;
    renderCart();
    updateCartCount();
  }

  function removeFromCart(e) {
    if (!e.target.classList.contains('remove-btn')) return;
    const key = e.target.dataset.key;
    delete cart[key];
    renderCart();
    updateCartCount();
  }

  function clearCart() {
    Object.keys(cart).forEach(key => delete cart[key]);
    updateCartCount();
    renderCart();
  }

  cartBtn.addEventListener('click', () => {
    cartModal.style.display = cartModal.style.display === 'block' ? 'none' : 'block';
    renderCart();
  });

  closeCartBtn.addEventListener('click', () => {
    cartModal.style.display = 'none';
  });

  document.body.addEventListener('click', addToCart);
  cartItemsDiv.addEventListener('input', updateCartQty);
  cartItemsDiv.addEventListener('click', removeFromCart);

  discordInput.addEventListener('input', () => {
    checkoutBtn.disabled = discordInput.value.trim().length === 0 || Object.keys(cart).length === 0;
  });

  checkoutBtn.addEventListener('click', () => {
    const discordUser = discordInput.value.trim();
    if (discordUser.length === 0) {
      alert('Please enter your Discord username.');
      discordInput.focus();
      return;
    }
    if (Object.keys(cart).length === 0) {
      alert('Your cart is empty.');
      return;
    }
    // Compose order message
    let orderDescription = `**New Order from:** ${discordUser}\n\n**Order Details:**\n`;
    let totalPrice = 0;
    for (const key in cart) {
      const item = cart[key];
      const subtotal = item.price * item.qty;
      totalPrice += subtotal;
      orderDescription += `• ${item.name} x${item.qty} - $${subtotal.toFixed(2)}\n`;
    }
    orderDescription += `\n**Total:** $${totalPrice.toFixed(2)}`;

    // Send to Discord webhook
    fetch(webhookURL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: orderDescription })
    })
    .then(res => {
      if (res.ok) {
        alert('Order placed! Please follow the payment instructions.');
        clearCart();
        discordInput.value = '';
        cartModal.style.display = 'none';
      } else {
        alert('Error sending order. Please try again later.');
      }
    })
    .catch(() => alert('Error sending order. Check your internet connection.'));
  });

  renderItems(hacksItemsData, hacksContainer, 'hacks-items');
  renderItems(basesItemsData, basesContainer, 'bases-items');
  renderItems(itemsItemsData, itemsContainer, 'items-items');
  updateCartCount();
</script>

</body>
</html>
